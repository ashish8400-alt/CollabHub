<!DOCTYPE html>
<html>
<head>
    <title>Socket Test</title>
</head>

<body>

    <h1>CollabHub Socket Test By Ashish</h1>

     <input
        type="text"
        id="messageInput"
        placeholder="Type message"
    >

    <button onclick="sendMessage()">
        Send
    </button>

    <script src="http://localhost:5000/socket.io/socket.io.js"></script>

    <script>

        const token = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpZCI6IjZhYjJkZWVmN2Q1Njc4ZjQ3OGMwYzI0NyIsInJvbGUiOiJVU0VSIiwiaWF0IjoxNzkwMTA4MTY0LCJleHAiOjE3OTA3MTI5NjR9.Ji7faLy3XE0b2DG6cBO24pmBOBQr9Pj-Nw0nSU5XHGU";

        const socket = io("http://localhost:5000", {
            auth: {
                token: token
            }
        });


        socket.on("connect", () => {

            console.log("Connected to server");
            console.log("Socket ID:", socket.id);

        });

         // Ashish → Rahul
        function sendMessage() {

            const message =
                document.getElementById("messageInput").value;


            socket.emit("message", {

                receiverId: "6ab2dfecf9879309481aa373",

                message: message

            });

        }


        socket.on("message", (data) => {

            console.log("Message from server:", data);

        });


          // Connection error
        socket.on("connect_error", (error) => {

            console.log("Connection error:", error.message);

        });


    </script>

</body>
</html>
